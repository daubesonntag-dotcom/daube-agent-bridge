name: Hybrid Executor v1 (isolated)
on:
  pull_request:
    paths:
      - "hybrid-executor-v1/**"
      - ".github/workflows/hybrid-executor-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hybrid-v1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Verify exact source SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Validate Cloudflare modules
        run: |
          node --check hybrid-executor-v1/cloudflare/coordinator.js
          node --check hybrid-executor-v1/cloudflare/executor-b.js
          node --check hybrid-executor-v1/browser-control/browser-control.cjs
      - name: Bounded coordinator and browser contract tests
        run: |
          node --test hybrid-executor-v1/cloudflare/coordinator.test.mjs
          node --test hybrid-executor-v1/browser-control/browser-control.test.cjs
      - name: GCP A contract tests
        run: python -m unittest discover -s hybrid-executor-v1/gcp -p "test_*.py" -v
