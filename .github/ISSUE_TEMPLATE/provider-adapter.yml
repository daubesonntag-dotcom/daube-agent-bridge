name: Provider adapter / compatibility
about: Report a provider format change or request a new adapter
labels: [compatibility]
body:
  - type: input
    id: provider
    attributes:
      label: Provider / host
    validations:
      required: true
  - type: input
    id: docs
    attributes:
      label: Authoritative documentation URL
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: What changed or is missing?
    validations:
      required: true
  - type: textarea
    id: fixture
    attributes:
      label: Minimal fixture or expected artifact
