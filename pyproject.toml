[project]
name = "daube-agent-bridge"
version = "0.1.3"
description = "Write one AI skill spec; compile it for MCP, Claude, Gemini, DeepSeek, Meta and browser agents."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "D'AUBE SONNTAG"}]
dependencies = ["fastmcp>=4.0.0", "PyYAML>=6.0.2"]
keywords = ["mcp", "ai-agents", "claude", "gemini", "deepseek", "llama", "chatgpt"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.12"]
a2a = ["a2a-sdk==1.2.2"]

[project.scripts]
daube-bridge = "daube_bridge.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

# Preserve the existing model validator's public ValueError contract for
# malformed user specs, rather than changing runtime exception behavior to
# satisfy the generic type-error lint suggestion.
[tool.ruff.lint.per-file-ignores]
"src/daube_bridge/model.py" = ["TRY004"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/daube_bridge"]
